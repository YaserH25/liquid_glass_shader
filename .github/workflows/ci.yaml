name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test example/lib example/test example/integration_test
      - run: flutter analyze
      - run: flutter test
      # The refraction shader on Impeller, which only the example bundles.
      - run: flutter test --enable-impeller
        working-directory: example
      - run: dart pub publish --dry-run
